<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Dola completed response evidence</title></head>
  <body>
    <aside>
      <button aria-haspopup="menu"><img alt="[redacted-account-avatar]"><span>[redacted-account-name]</span></button>
    </aside>
    <main>
      <div data-render-engine="node" data-plugin-identifier="block_type:10000" class="flex justify-end">
        <div class="bg-g-send-msg-bubble-bg">
          <div class="md-box-root" data-streaming="false">[redacted-test-prompt]</div>
        </div>
      </div>
      <div data-render-engine="node" data-plugin-identifier="block_type:10000">
        <div data-container-type="block-v2">
          <div class="md-box-root" data-streaming="false">[redacted-test-response]</div>
        </div>
      </div>
      <div class="max-w-full min-w-0 flex-1 relative flex items-center h-36">
        <div><button type="submit" data-dbx-name="button" aria-label="[redacted-attachment-control]"></button></div>
        <button type="button" data-slot="dropdown-menu-trigger"><span>Fast</span></button>
        <button type="submit" class="!bg-g-send-msg-btn-disabled-bg" disabled></button>
      </div>
      <textarea class="semi-input-textarea semi-input-textarea-autosize" placeholder="Message..."></textarea>
    </main>
  </body>
</html>

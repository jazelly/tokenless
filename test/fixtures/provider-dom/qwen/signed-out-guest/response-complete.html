<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>Qwen guest response evidence</title></head>
  <body>
    <button type="button">登录</button>
    <div class="chat-round last-message-item">
      <div>[redacted prompt]</div>
      <div class="chat-answers-card-wrap">
        <div class="qk-markdown qk-markdown-react qk-markdown-code-dark qk-markdown-complete">
          <div class="qk-md-paragraph"><span class="qk-md-text complete">[redacted response]</span></div>
        </div>
      </div>
    </div>
    <div
      contenteditable="true"
      role="textbox"
      aria-multiline="true"
      data-placeholder="向千问提问"
      data-slate-editor="true"
      data-slate-node="value"
      translate="no"
    ><p>向千问提问</p></div>
    <button type="button" aria-label="发送消息" disabled></button>
  </body>
</html>

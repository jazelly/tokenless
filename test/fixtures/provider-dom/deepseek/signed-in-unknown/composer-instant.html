<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>DeepSeek Instant composer evidence</title></head>
  <body>
    <main>
      <div role="radiogroup">
        <div role="radio" aria-checked="true"><span>Instant</span></div>
        <div role="radio" aria-checked="false"><span>Expert</span></div>
        <div role="radio" aria-checked="false"><span>Vision</span></div>
      </div>
      <textarea name="search" placeholder="Message DeepSeek"></textarea>
      <div class="ds-toggle-button ds-toggle-button--m ds-toggle-button--selected" aria-pressed="true"><span>DeepThink</span></div>
      <div class="ds-toggle-button ds-toggle-button--m ds-toggle-button--selected" aria-pressed="true"><span>Search</span></div>
      <input type="file" multiple accept=".txt,.pdf,.png,.jpg">
      <div role="button" class="ds-button ds-button--iconLabelPrimary"></div>
      <div role="button" class="ds-button ds-button--primary ds-button--disabled"></div>
    </main>
  </body>
</html>

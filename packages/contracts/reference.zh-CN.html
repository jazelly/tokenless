 前响应","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}}},"tags":["OpenAI-compatible"]}},"/v1/images/generations":{"post":{"operationId":"createImageGeneration","summary":"通过统一的 browser 或 direct provider interface 生成图片","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ImageGenerationRequest"}}}},"responses":{"200":{"description":"持久化在 authenticated daemon URL 后的 generated image asset","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ImageGenerationResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"500":{"$ref":"#/components/responses/InternalError"},"502":{"$ref":"#/components/responses/BadGateway"},"503":{"$ref":"#/components/responses/ServiceUnavailable"},"504":{"$ref":"#/components/responses/GatewayTimeout"}},"tags":["OpenAI-compatible"]}},"/v1/models":{"get":{"operationId":"listApiProxyModelsOnDefaultPath","summary":"在默认 OpenAI path 列出 tokenless/\u003cprovider> model name","responses":{"200":{"description":"OpenAI shape 的 model list","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyModelList"}}}},"401":{"description":"缺少 control bearer token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"403":{"description":"Control bearer token 被拒绝","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"500":{"description":"已清理的本地 daemon failure","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"503":{"description":"API proxy 已禁用","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}}},"description":"返回与 GET /v1/openai/models 相同的 model list。该 path 是

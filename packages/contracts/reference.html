minal chunk.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicRequest"}}}},"responses":{"200":{"description":"Visible provider response in Anthropic message shape","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicResponse"}},"text/event-stream":{"schema":{"type":"string"}}}},"400":{"description":"Invalid or unsupported request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"401":{"description":"Missing control bearer token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"403":{"description":"Rejected control bearer token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"404":{"description":"The model does not name a supported provider","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"413":{"description":"Request body exceeds the 2 MiB HTTP boundary","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"500":{"description":"Sanitized local daemon failure","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"502":{"description":"Sanitized visible-provider failure","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"503":{"description":"The API proxy is disabled, the managed profile is not ready, or the provider is not enabled for it","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}},"504":{"description":"The visible provider did not respond before the deadline","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyAnthropicError"}}}}},"tags":["Anthropic-compatible"]}},"/v1/chat/completions":{"post":{"operationId":"createApiProxyChatCompletionOnDefaultPath","summary":"Run an OpenAI-compatible chat completion on the default OpenAI path","description":"Accepts the OpenAI chat-completions request shape and returns the visible provider response. Modern function tools, complete tool-result history, json_object, and the documented json_schema subset are validated through one request-scoped protocol; Tokenless returns model-ordered tool calls or a final result that satisfies response_format and never executes caller tools. Streaming for browser/native and structured requests returns one terminal full-content or tool-call delta, a terminal finish reason, and [DONE] without usage; direct G4F plain-text requests instead forward each upstream SSE body chunk unchanged, preserving provider order and [DONE]. parallel_tool_calls defaults to true; false limits the current outcome to one call. tool_choice supports omitted/auto, none, required, and one exact named function. strict tool schemas and structured-final object schemas require recursively closed objects with every property required. Structured-final numbers must be canonical finite JSON numbers, with integral schema and output values limited to the JavaScript safe integer range. Protocol or schema violations terminate with provider_output_protocol_error. Deprecated functions/function_call are rejected. This path is an alias of the /v1/openai prefixed route so an unmodified OpenAI client works with only a baseURL override.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiRequest"}}}},"responses":{"200":{"description":"Visible provider response in OpenAI chat-completion shape; browser/native and structured streams use terminal generated frames, while direct G4F plain-text streams forward raw upstream SSE chunks unchanged.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiResponse"}},"text/event-stream":{"schema":{"type":"string"}}}},"400":{"description":"Invalid or unsupported request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"401":{"description":"Missing control bearer token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"403":{"description":"Rejected control bearer token","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"404":{"description":"The model does not name a supported provider","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"413":{"description":"Request body exceeds the 2 MiB HTTP boundary","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"500":{"description":"Sanitized local daemon failure","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"502":{"description":"Sanitized visible-provider failure","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"503":{"description":"The API proxy is disabled, the managed profile is not ready, or the provider is not enabled for it","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}},"504":{"description":"The visible provider did not respond before the deadline","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiError"}}}}},"tags":["OpenAI-compatible"]}},"/v1/images/generations":{"post":{"operationId":"createImageGeneration","summary":"Generate images through one browser or direct provider interface","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ImageGenerationRequest"}}}},"responses":{"200":{"description":"Generated image assets persisted behind authenticated daemon URLs","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ImageGenerationResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/com urns model-ordered tool calls or a final result that satisfies response_format and never executes caller tools. Streaming for browser/native and structured requests returns one terminal full-content or tool-call delta, a terminal finish reason, and [DONE] without usage; direct G4F plain-text requests instead forward each upstream SSE body chunk unchanged, preserving provider order and [DONE]. parallel_tool_calls defaults to true; false limits the current outcome to one call. tool_choice supports omitted/auto, none, required, and one exact named function. strict tool schemas and structured-final object schemas require recursively closed objects with every property required. Structured-final numbers must be canonical finite JSON numbers, with integral schema and output values limited to the JavaScript safe integer range. Protocol or schema violations terminate with provider_output_protocol_error. Deprecated functions/function_call are rejected. The explicit tokenless/auto model is browser-only and accepts only tool or structured-final requests. It filters enabled, currently usable providers by the complete request requirements and real-evidence matrix, preserves portable canonical tool history and public call ids, and may use the existing fallback plan only before provider_submitted_at. Exact tokenless/\u003cprovider> models never auto-switch.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiRequest"}}}},"responses":{"200":{"description":"Visible provider response in OpenAI chat-completion shape; browser/native and structured streams use terminal generated frames, while direct G4F plain-text streams forward raw upstream SSE chunks unchanged.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiProxyOpenAiResponse"}},"text/event-stream":{"schema":{"type":"string"}}}},"400":{"description":"Invalid or unsupported request","content":{"application/json":{"schema":{"$ref":"#/components/s

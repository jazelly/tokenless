<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tokenless Harness</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main>
      <header class="title-row">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="app-heading"></h1>
        </div>
        <button id="settings" class="icon-button" type="button" aria-label="Settings" title="Settings">&#9881;</button>
      </header>

      <section class="card">
        <h2 id="connection-heading"></h2>
        <p id="connection" class="status"></p>
        <label><span id="daemon-label"></span><input id="daemon" value="http://127.0.0.1:7331" autocomplete="off"></label>
        <p id="route" class="muted"></p>
        <div class="button-row">
          <button id="pair" type="button"></button>
          <button id="unpair" class="secondary" type="button"></button>
          <button id="refresh" class="secondary" type="button"></button>
        </div>
        <p id="pairing-help" class="muted"></p>
      </section>

      <section class="card">
        <h2 id="current-tab-heading"></h2>
        <p id="page" class="status"></p>
        <p id="origin" class="muted"></p>
        <label class="checkbox"><input id="consent" type="checkbox"> <span id="consent-label"></span></label>
        <button id="attach" type="button"></button>
        <pre id="inventory" class="inventory" aria-live="polite"></pre>
      </section>

      <section class="card">
        <h2 id="task-heading"></h2>
        <label for="task"><span id="task-label"></span></label>
        <textarea id="task" rows="3"></textarea>
        <div class="button-row">
          <button id="run" type="button"></button>
          <button id="cancel" class="secondary" type="button"></button>
        </div>
        <p id="run-status" class="status"></p>
        <pre id="final" class="inventory" hidden></pre>
      </section>

      <section id="approval" class="card approval" hidden>
        <h2 id="approval-heading"></h2>
        <p id="proposal"></p>
        <label id="upload-label" hidden><span id="upload-label-text"></span><input id="upload-file" type="file"></label>
        <div class="button-row">
          <button id="approve" type="button"></button>
          <button id="reject" class="secondary" type="button"></button>
        </div>
      </section>

      <section class="disclosure">
        <strong id="privacy-heading"></strong>
        <p id="privacy-body"></p>
      </section>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>

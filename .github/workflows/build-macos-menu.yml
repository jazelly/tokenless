name: Build macOS menu bar app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-menu:
    runs-on: [self-hosted, tokenless-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify supported runner
        run: test "$(node -p '`${process.platform}-${process.arch}`')" = darwin-arm64
      - id: package-version
        name: Read CLI package version
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/cli/package.json", "utf8")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build CLI package artifacts
        run: npm run build --workspace packages/cli
      - name: Build macOS menu bar app
        env:
          RELEASE_VERSION: ${{ steps.package-version.outputs.version }}
        run: node scripts/build-macos-menu.mjs --release-version "$RELEASE_VERSION"
      - name: Upload macOS menu bar app
        uses: actions/upload-artifact@v4
        with:
          name: tokenless-macos-darwin-arm64-v${{ steps.package-version.outputs.version }}
          path: |
            dist/macos/tokenless-macos-darwin-arm64-v${{ steps.package-version.outputs.version }}.zip
            dist/macos/tokenless-macos-darwin-arm64-v${{ steps.package-version.outputs.version }}.zip.sha256
          if-no-files-found: error

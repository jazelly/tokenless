name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - '.changeset/publish-pending.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: tokenless-npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        run: node scripts/release/verify-pending.mjs "$GITHUB_OUTPUT"

  publish-cli:
    needs: [prepare, build-macos-release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Publish CLI
        run: node scripts/release/publish-package.mjs packages/cli

  build-macos-release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: [self-hosted, tokenless-macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify supported runner
        run: test "$(node -p '`${process.platform}-${process.arch}`')" = darwin-arm64
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/cli/package.json", "utf8")).version')" = "$RELEASE_VERSION"
      - name: Build CLI package artifacts
        run: npm run build --workspace packages/cli
      - name: Build versioned macOS menu bar app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-macos-menu.mjs --release-version "$RELEASE_VERSION"
      - name: Upload release artifacts for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: tokenless-macos-darwin-arm64-v${{ needs.prepare.outputs.version }}
          path: |
            dist/macos/tokenless-macos-darwin-arm64-v${{ needs.prepare.outputs.version }}.zip
            dist/macos/tokenless-macos-darwin-arm64-v${{ needs.prepare.outputs.version }}.zip.sha256
          if-no-files-found: error

  create-github-release:
    needs: [prepare, publish-cli, build-macos-release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract release notes from persisted changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/extract-changelog-section.mjs "$VERSION" /tmp/tokenless-release-notes.md
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tokenless-macos-darwin-arm64-v${{ needs.prepare.outputs.version }}
          path: /tmp/tokenless-macos-release
      - name: Verify macOS release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ZIP="/tmp/tokenless-macos-release/tokenless-macos-darwin-arm64-v$VERSION.zip"
          CHECKSUM="$ZIP.sha256"
          test -f "$ZIP"
          test -f "$CHECKSUM"
          (cd /tmp/tokenless-macos-release && shasum -a 256 -c "$(basename "$CHECKSUM")")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "tokenless $TAG" \
              --notes-file /tmp/tokenless-release-notes.md
          fi
          gh release upload "$TAG" \
            "/tmp/tokenless-macos-release/tokenless-macos-darwin-arm64-v$VERSION.zip" \
            "/tmp/tokenless-macos-release/tokenless-macos-darwin-arm64-v$VERSION.zip.sha256"

  clear-pending-marker:
    needs: [prepare, create-github-release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove the published release marker in a second commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CLEANUP_BRANCH="release/clear-publish-marker-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B "$CLEANUP_BRANCH" origin/main
          node scripts/release/verify-pending.mjs /tmp/release-output
          grep -Fx "version=$VERSION" /tmp/release-output
          npm install --package-lock-only --ignore-scripts
          git rm .changeset/publish-pending.json
          git add package-lock.json
          git commit -m "chore(release): clear publish marker for tokenless@$VERSION"
          git push origin "HEAD:refs/heads/$CLEANUP_BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$CLEANUP_BRANCH" \
            --title "chore(release): clear publish marker for tokenless@$VERSION" \
            --body "- Clear the completed tokenless@$VERSION publish marker and refresh its release lockfile.")
          gh pr merge "$PR_URL" --rebase --delete-branch
